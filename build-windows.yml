name: Build SmartSlice Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build standalone exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SmartSlice_0.1.2 --collect-all trimesh --collect-all networkx smartslice_0_1_2.py
      - name: Verify packaged export dependencies
        run: |
          python -c "import networkx; import trimesh; import zipfile; import io; data=trimesh.creation.box().export(file_type='3mf'); assert zipfile.ZipFile(io.BytesIO(data)).testzip() is None; print('3MF export dependency smoke test passed')"
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SmartSlice_0.1.2_Windows
          path: dist/SmartSlice_0.1.2.exe
