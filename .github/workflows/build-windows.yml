
name: Build SmartSlice Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build standalone exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SmartSlice_0.1.1 --collect-all trimesh smartslice_0_1_1.py
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SmartSlice_0.1.1_Windows
          path: dist/SmartSlice_0.1.1.exe
